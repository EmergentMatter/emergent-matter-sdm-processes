[project]
name = "emergent-matter-sdm-processes"
version = "1.0.0"
description = "Unified manufacturing-process / machine-capability substrate for the Software Defined Matter ecosystem: process families and machine-specific presets with per-property provenance"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [{ name = "Emergent Matter" }]
keywords = [
    "manufacturing",
    "additive-manufacturing",
    "3d-printing",
    "design-rules",
    "process-capability",
    "provenance",
    "software-defined-matter",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/EmergentMatter/emergent-matter-sdm-processes"
Repository = "https://github.com/EmergentMatter/emergent-matter-sdm-processes"
Issues = "https://github.com/EmergentMatter/emergent-matter-sdm-processes/issues"
Changelog = "https://github.com/EmergentMatter/emergent-matter-sdm-processes/blob/main/CHANGELOG.md"

# Note on materials data:
# No materials catalog is a declared dependency (even optional).
# Preset.s_default_material is a plain string identifier; a consumer that
# wants a material record dereferences it against whatever materials
# source it uses. This keeps the package dependency-free and
# independently releasable.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emergent_matter_processes"]

[tool.hatch.build]
# An allowlist, so the sdist carries the package sources and the data files the
# wheel ships, and nothing else: no tests, CI config, agent guidance or lock file
# goes onto the public index.
include = [
    "src/emergent_matter_processes/**/*.py",
    "src/emergent_matter_processes/py.typed",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.16",
    "mypy>=1.14",
]

# ── towncrier: turns changelog.d/ notes into CHANGELOG.md ─────────────────
#
# Exactly three fragment types, matching the three bump levels the release
# workflow understands (see EmergentMatter/actions CONTRACT.md). Do not add
# a fourth type: compute_bump.py only recognizes major/minor/patch and
# exits 1 on anything else.
[tool.towncrier]
directory = "changelog.d"          # where `uv run scripts/changeset.py` writes notes
filename = "CHANGELOG.md"
# Insert this marker into CHANGELOG.md once, above your existing history.
# towncrier writes new release sections directly below it and never touches
# anything beneath: see docs/onboarding.md for inserting it into a
# hand-written changelog without disturbing prior entries.
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## {version} ({project_date})"
underlines = ["-", "~", "^"]

[[tool.towncrier.type]]
directory = "major"
name = "Major"
showcontent = true

[[tool.towncrier.type]]
directory = "minor"
name = "Minor"
showcontent = true

[[tool.towncrier.type]]
directory = "patch"
name = "Patch"
showcontent = true

# ── em-release: tells sync_version.py every place the version string lives ──
#
# One entry per "path:symbol" location, beyond `[project] version` itself
# (that one is handled separately, by `uv version --bump` in the release
# workflow; do not list it here).
#
# Every location you list gets written on every release. Anything you don't
# list is never touched: that's deliberate, so a data/schema version that
# is meant to move independently of the package version is safe just by
# being left off this list. __catalog_version__ is deliberately not
# listed here: it is a data version that moves independently of the
# package version.
[tool.em-release]
tier = "open"
templates_version = "v1.15.0"
version_files = [
  "src/emergent_matter_processes/__init__.py:__version__",
]

# ── mypy ────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.13"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
